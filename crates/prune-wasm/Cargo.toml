[package]
name = "prune-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prune = { path = "../prune" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }
ark-bn254 = "0.5"
ark-ff = "0.5"
rand = "0.8"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
